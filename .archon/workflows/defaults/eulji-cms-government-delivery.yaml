# Eulji CMS government delivery workflow
# Purpose: Run a deterministic coding-agent process for https://github.com/lee-seonghun/eulji_cms_platform.git
#
# Model routing policy:
#   - pi - openai/gpt-5.5
#     Use for high-context reasoning, government-delivery requirements analysis,
#     policy/acceptance judgement, traceability, accessibility, security posture,
#     operations readiness, and final delivery validation.
#   - pi - openai/gpt-5.3-codex
#     Use for full-repository architecture, codebase navigation, integration design,
#     cross-module refactoring, code review, validation strategy, and defect repair.
#   - pi - openai/gpt-5.4-mini
#     Use for small bounded unit implementation where speed/cost efficiency matters.
#     Do not let mini be the final authority for RBAC, security, audit logging,
#     accessibility, data retention, operational monitoring, or integration architecture.
#
# Risk gate:
#   Any change touching auth/RBAC, security, audit logging, accessibility,
#   data retention, monitoring, deployment, public-sector acceptance criteria,
#   or cross-module architecture must pass both:
#   1) pi - openai/gpt-5.3-codex code/integration verification
#   2) pi - openai/gpt-5.5 delivery/requirements verification

nodes:
  - id: intake-and-scope
    prompt: |
      Use pi - openai/gpt-5.5.

      Establish the project scope for eulji_cms_platform as a government-delivery CMS.
      Read the repository, docs, existing requirements, and recent changes.

      Produce a concise scope brief that identifies:
      - delivery target and assumed stakeholders
      - public-sector CMS acceptance boundaries
      - known constraints and missing information
      - high-risk domains: RBAC, security, audit logging, accessibility, data retention, monitoring, deployment, kiosk/signage integration
      - documents or code areas that require special attention

      Do not implement code in this step.

  - id: requirements-analysis
    depends_on: [intake-and-scope]
    prompt: |
      Use pi - openai/gpt-5.5.

      Act as a government-delivery CMS requirements analyst.
      Convert the project scope into implementation-ready requirements.

      Produce or update a requirements artifact under docs/ that includes:
      - functional requirements
      - non-functional requirements
      - public-sector acceptance criteria
      - accessibility and barrier-free kiosk expansion readiness
      - security, RBAC, audit logging, data retention, and operations requirements
      - traceability IDs for each requirement
      - risk rating: low, medium, high
      - implementation priority and suggested model route for each requirement

      Mark high-risk items that must pass codex and gpt-5.5 verification after implementation.

  - id: architecture-design
    depends_on: [requirements-analysis]
    prompt: |
      Use pi - openai/gpt-5.3-codex.

      Act as the whole-code architecture owner for eulji_cms_platform.
      Inspect the complete repository structure, implementation patterns, tests, and requirements artifact.

      Produce or update an architecture artifact under docs/ that defines:
      - bounded modules and service boundaries
      - CMS domain model and content lifecycle
      - API, persistence, auth/RBAC, audit, logging, deployment, and operations architecture
      - kiosk/signage/client integration points
      - test and validation strategy
      - migration risks and technical debt
      - implementation slices suitable for pi - openai/gpt-5.4-mini
      - high-risk slices that require pi - openai/gpt-5.3-codex review and pi - openai/gpt-5.5 delivery validation

      Keep the architecture incremental and executable by coding agents.

  - id: unit-feature-implementation
    depends_on: [architecture-design]
    loop:
      prompt: |
        Use pi - openai/gpt-5.4-mini.

        Implement the next smallest low-risk or medium-risk unit feature from the requirements and architecture artifacts.

        Rules:
        - choose one cohesive implementation slice only
        - avoid broad architecture changes unless already specified by architecture-design
        - update production code and tests together
        - preserve existing conventions
        - run the narrowest relevant validation commands
        - record changed files, tests run, result, and remaining tasks

        Guardrail:
        If the task touches auth/RBAC, security, audit logging, accessibility,
        data retention, monitoring, deployment, or cross-module integration,
        implement only the smallest safe change and explicitly flag it for
        high-risk-code-review and delivery-compliance-validation.

        Stop only when the planned implementation backlog is complete or blocked by missing information.
      until: ALL_TASKS_COMPLETE
      fresh_context: true

  - id: high-risk-code-review
    depends_on: [unit-feature-implementation]
    prompt: |
      Use pi - openai/gpt-5.3-codex.

      Perform full-repository code and integration review after unit implementation.

      Focus on:
      - architecture drift from the architecture artifact
      - broken module boundaries
      - hidden coupling and duplicated logic
      - auth/RBAC correctness
      - audit logging completeness and tamper-resistance assumptions
      - security-sensitive input/output handling
      - data retention and operational monitoring implementation
      - accessibility-related code paths
      - test coverage and validation gaps

      Fix code-level and integration-level defects where safe.
      Record remaining risks that require gpt-5.5 delivery judgement.

  - id: delivery-compliance-validation
    depends_on: [high-risk-code-review]
    prompt: |
      Use pi - openai/gpt-5.5.

      Validate the repository as a government-delivery CMS artifact.
      This is a requirements, policy, and acceptance judgement step, not a broad implementation step.

      Confirm:
      - requirement traceability from docs to code/tests
      - public-sector acceptance criteria coverage
      - accessibility and barrier-free kiosk expansion readiness
      - security, RBAC, audit logging, data retention, and operations readiness
      - documentation completeness
      - validation evidence and test result sufficiency
      - unresolved risks and delivery blockers

      Produce or update a final delivery validation report under docs/.
      If any high-risk implementation lacks codex verification or test evidence, mark it as not ready.

  - id: architecture-finalization
    depends_on: [delivery-compliance-validation]
    prompt: |
      Use pi - openai/gpt-5.3-codex.

      Perform final architecture and repository hygiene.
      Apply only safe final fixes that do not change delivery scope.

      Run available validation commands, summarize changed files, confirm no obvious architecture drift remains,
      and prepare the branch for commit or PR.

  - id: final-delivery-summary
    depends_on: [architecture-finalization]
    prompt: |
      Use pi - openai/gpt-5.5.

      Produce a final executive summary for the government-delivery CMS work.
      Include:
      - completed scope
      - model routing used
      - requirements satisfied
      - verification evidence
      - remaining risks
      - recommended next workflow run

      Do not introduce new code changes in this final summary step.
